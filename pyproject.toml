[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cecli-browser-harness"
version = "0.1.13.post1"
description = "Fork of browser-harness with relaxed dependency pins, published for cecli."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "automation", "browser", "cdp", "chrome", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "cdp-use==1.4.5",
    "fetch-use==0.4.0",
    "pillow==12.3.0",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
mcp = ["mcp==2.1.1"]

[project.scripts]
browser-harness = "browser_harness.run:main"
browser-harness-mcp = "browser_harness.mcp_cli:main"

[project.urls]
Homepage = "https://github.com/cecli-dev/browser-harness"
Repository = "https://github.com/cecli-dev/browser-harness"
Issues = "https://github.com/cecli-dev/browser-harness/issues"
Upstream = "https://github.com/browser-use/browser-harness"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_harness = ["SKILL.md", "video-template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
