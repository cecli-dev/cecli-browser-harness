name: release

on:
  release:
    types: [published]

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pyproject.toml is cecli-browser-harness package
        run: |
          if ! grep -q 'name = "cecli-browser-harness"' pyproject.toml; then
            echo "ERROR: pyproject.toml does not have name = 'cecli-browser-harness'"
            exit 1
          fi
      - name: Build distributions
        run: |
          python -m pip install build==1.6.0
          python -m build
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
